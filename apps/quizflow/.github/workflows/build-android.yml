name: Build practice APK
on:
  workflow_dispatch:
  push:
    branches: [main, feat/quizflow-navigation]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: npm ci
      - run: npm run build && node scripts/sync-android-assets.mjs && npm test
      - run: gradle -p android :app:testProdDebugUnitTest :app:assembleProdRelease
      - uses: actions/upload-artifact@v4
        with:
          name: QuizFlow-APK
          path: android/app/build/outputs/apk/prod/release/*.apk
